services:
  db:
    image: postgres:16
    container_name: nutrilog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutrilog
      POSTGRES_PASSWORD: nutrilog
      POSTGRES_DB: nutrilog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: